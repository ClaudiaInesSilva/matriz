name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:

  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18.7
        env:
          POSTGRES_DB: matriz_test
          POSTGRES_USER: matriz_test_app
          POSTGRES_PASSWORD: ci_test_password_disposable
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 10s
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run backend tests
        env:
          MATRIZ_TEST_DB_USERNAME: matriz_test_app
          MATRIZ_TEST_DB_PASSWORD: ci_test_password_disposable
        run: |
          cd backend
          mvn test

  frontend-checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint
        run: |
          cd frontend
          npm run lint

      - name: Build
        run: |
          cd frontend
          npm run build

      # --- Playwright E2E ---

      - name: Install Playwright browsers
        run: |
          cd frontend
          npx playwright install --with-deps chromium

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run Playwright E2E
        env:
          MATRIZ_E2E_USERNAME: demo.alex
          MATRIZ_E2E_PASSWORD: ci_e2e_password
          MATRIZ_E2E_PROJECT_ID: 20000000-0000-4000-8000-000000000001
          VITE_API_PROXY_TARGET: http://localhost:8080
        run: |
          set -euo pipefail

          # --- Cleanup trap: stop backend process group and DB container on exit ---
          BACKEND_PGID=""
          cleanup() {
            if [ -n "$BACKEND_PGID" ]; then
              kill -- -"$BACKEND_PGID" 2>/dev/null || true
              sleep 2
              kill -9 -- -"$BACKEND_PGID" 2>/dev/null || true
              wait 2>/dev/null || true
            fi
            docker stop matriz-e2e-db 2>/dev/null || true
            docker rm matriz-e2e-db 2>/dev/null || true
          }
          trap cleanup EXIT

          # --- Start disposable PostgreSQL container ---
          docker run --name matriz-e2e-db \
            -e POSTGRES_DB=matriz_test \
            -e POSTGRES_USER=matriz_test_app \
            -e POSTGRES_PASSWORD=ci_test_password_disposable \
            -p 5432:5432 \
            -d postgres:18.7

          # --- Wait for PostgreSQL readiness inside the container ---
          echo "Waiting for PostgreSQL to be ready..."
          for i in $(seq 1 30); do
            if docker exec matriz-e2e-db pg_isready -U matriz_test_app -d matriz_test; then
              echo "PostgreSQL is ready."
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "ERROR: PostgreSQL did not become ready within 60 seconds."
              exit 1
            fi
            sleep 2
          done

          # --- Start Spring Boot backend in a separate process group ---
          cd backend
          setsid bash -c 'DB_URL=jdbc:postgresql://localhost:5432/matriz_test \
            DB_USERNAME=matriz_test_app \
            DB_PASSWORD=ci_test_password_disposable \
            SPRING_PROFILES_ACTIVE=local \
            mvn spring-boot:run' &
          BACKEND_PGID=$!
          cd ..

          # --- Wait for backend readiness (HTTP 200 required) ---
          echo "Waiting for Spring Boot backend to be ready..."
          for i in $(seq 1 60); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/auth/csrf 2>/dev/null || true)
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Backend is ready (HTTP 200)."
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "ERROR: Backend did not become ready within 120 seconds. Last HTTP code: $HTTP_CODE"
              exit 1
            fi
            sleep 2
          done

          # --- Update demo user password hash ---
          # Store the hash in a single-quoted variable to prevent shell expansion of $ characters.
          # Run psql inside the PostgreSQL container to avoid relying on host psql.
          BCRYPT_HASH='$2b$10$mmJZXr9oStyDFgLYULXhWe.vXLRu9aw3Bcjv.5DanuWI41MIURwmq'
          docker exec matriz-e2e-db psql -v ON_ERROR_STOP=1 \
            -U matriz_test_app -d matriz_test \
            -c "UPDATE users SET password_hash = '${BCRYPT_HASH}' WHERE username = 'demo.alex';"

          # --- Run Playwright E2E tests ---
          cd frontend
          npx playwright test

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-checks]

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t matriz-backend:0.1.0 ./backend

      - name: Build frontend image
        run: docker build -t matriz-frontend:0.1.0 ./frontend
