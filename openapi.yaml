openapi: 3.1.0
info:
  title: Matriz MVP API
  version: 0.1.0
  description: >-
    Proposed API contract for three Matriz MVP operations. Detailed requirements
    remain subject to client validation. Task assignment is not included.
    The task status property has no enumerated values or API default. Requiring
    a status in the task creation request is a provisional API assumption that
    requires client validation. This limited contract does not define the
    separately required task-status update operation or a project progress
    summary. Identifier values are represented as strings in this API proposal;
    their underlying representation remains undecided.
paths:
  /projects:
    get:
      operationId: listProjects
      summary: List projects
      description: >-
        Returns projects available to the caller under access rules that remain
        to be defined. Authentication and the rules for project visibility are
        not specified by this contract. An empty list is returned when no
        projects are available.
      responses:
        '200':
          description: Project list retrieved successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
        '500':
          description: An unexpected server error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: createProject
      summary: Create a project
      description: >-
        Creates a new project. A non-empty project name is assumed by the
        current user stories; this proposed API behavior remains subject to
        client validation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: Project created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          description: The request body is malformed or contains invalid project data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: An unexpected server error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /projects/{projectId}/tasks:
    post:
      operationId: createProjectTask
      summary: Create a task in a project
      description: >-
        Creates a task associated with the identified project. The project
        association is taken from the path. The client must validate whether a
        caller may supply the initial status; this proposal requires a status
        value but defines neither its allowed values nor a default.
      parameters:
        - name: projectId
          in: path
          required: true
          description: Identifier of the existing project for the new task.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '201':
          description: Task created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: The request body is malformed or contains invalid task data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No project exists with the supplied projectId.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: An unexpected server error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    CreateProjectRequest:
      type: object
      description: >-
        Project fields for creation. A non-empty name is assumed in the user
        stories and remains subject to client validation.
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          description: Project name; non-empty as a provisional requirement.

    Project:
      type: object
      description: >-
        Project summary. A project name is an assumption in the user stories;
        this proposal represents it as a required, non-empty field. Client
        validation is still pending, and other project fields remain undecided.
      required:
        - projectId
        - name
      properties:
        projectId:
          type: string
          description: Project identifier.
        name:
          type: string
          minLength: 1
          description: Project name; required and non-empty in this proposal, pending client validation.

    CreateTaskRequest:
      type: object
      description: >-
        Task fields for creation. Requiring status here is a provisional API
        assumption; whether status is supplied during creation or assigned by
        a client-approved rule remains open. No allowed values or default are
        defined.
      required:
        - title
        - status
      properties:
        title:
          type: string
          minLength: 1
          description: Task title; the user stories assume a non-empty title.
        status:
          type: string
          description: Current status value. Allowed values and creation rules are pending client validation.

    Task:
      type: object
      description: Task created within a project.
      required:
        - taskId
        - projectId
        - title
        - status
      properties:
        taskId:
          type: string
          description: Task identifier.
        projectId:
          type: string
          description: Identifier of the project to which this task belongs.
        title:
          type: string
          description: Task title.
        status:
          type: string
          description: Current task status; no status values or transition rules are specified.

    Error:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          description: Human-readable explanation of the request failure.
