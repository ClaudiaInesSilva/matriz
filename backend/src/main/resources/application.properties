spring.application.name=matriz-backend
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/matriz_db}
spring.datasource.username=${DB_USERNAME:matriz_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
matriz.demo-accounts.authentication-enabled=false
matriz.demo-accounts.auto-login-enabled=false
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${MATRIZ_SESSION_COOKIE_SECURE:true}
matriz.cors.allowed-origins=
server.port=${PORT:8080}
server.forward-headers-strategy=framework
